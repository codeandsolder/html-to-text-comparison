[package]
name = "html-to-text-comparison"
version = "0.1.0"
edition = "2021"

[dependencies]
allocation-counter = { version = "0.8.1", optional = true }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
august = { version = "2.4.0", optional = true }
boilerpipe = { version = "0.6.0", optional = true }
comfy-table = "7.2.2"
dom_smoothie = { version = "0.17.0", optional = true }
fast_html2md = { package = "fast_html2md", version = "0.0.62", optional = true, default-features = false, features = [
    "scraper",
] }
htmd = { version = "0.5.4", optional = true }
html2md = { version = "0.2.15", optional = true }
html2md-rs = { version = "0.10.2", optional = true }
html2text = { version = "0.17.1", optional = true }
llm_readability = { version = "0.0.17", optional = true }
mdka = { version = "2.1.5", optional = true }
nanohtml2text = { version = "0.2.1", optional = true }
readability = { version = "0.3.0", optional = true }
readable-readability = { version = "0.4.0", optional = true }
ureq = "2.12.1"
url = "2.5.8"

[features]
default = [
    "august",
    "boilerpipe",
    "dom_smoothie",
    "fast_html2md",
    "htmd",
    "html2md",
    "html2md-rs",
    "html2text",
    "llm_readability",
    "mdka",
    "nanohtml2text",
    "readability",
    "readable-readability",
]
htmd = ["dep:htmd"]
html2md = ["dep:html2md"]
html2md-rs = ["dep:html2md-rs"]
html2text = ["dep:html2text"]
llm_readability = ["dep:llm_readability"]
mdka = ["dep:mdka"]
nanohtml2text = ["dep:nanohtml2text"]
readability = ["dep:readability"]
readable-readability = ["dep:readable-readability"]
boilerpipe = ["dep:boilerpipe"]
august = ["dep:august"]
fast_html2md = ["dep:fast_html2md"]
reader-lm-api = []
