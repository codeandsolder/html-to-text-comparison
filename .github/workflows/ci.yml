name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@d3d509b57a06e72885a83ae743a4014e97cd9f95 # main
    with:
      timeout-minutes: 45
      command: |
        # Bootstrap the pinned uv wheel into runner-local ephemeral tooling.
        python3 -m venv "$RUNNER_TEMP/uv-bootstrap"
        "$RUNNER_TEMP/uv-bootstrap/bin/python" -m pip install --disable-pip-version-check --no-input "uv==0.13.9"
        export PATH="$RUNNER_TEMP/uv-bootstrap/bin:$PATH"
        PUPPETEER_SKIP_DOWNLOAD=1 npm ci --prefix tools/extractors --ignore-scripts --no-audit --no-fund
        npm test --prefix tools/extractors
        # This public CI uses an ephemeral Ubuntu runner. Install the distro
        # package normally, without disabling namespace restrictions.
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends bubblewrap apparmor-profiles apparmor-utils
        # Enable Ubuntu's packaged, program-specific user-namespace profile;
        # retain the global AppArmor restrictions for other applications.
        if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]; then
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
        fi
        bwrap --version
        bwrap --unshare-all --unshare-user --unshare-net --disable-userns --ro-bind /usr /usr --ro-bind-try /lib /lib --ro-bind-try /lib64 /lib64 -- /usr/bin/true
        # Pin the complete PyPy distribution; uv installs packages into the
        # explicit asset tree, never at extraction time.
        archive="$RUNNER_TEMP/pypy3.12-v8.0.1-linux64.tar.gz"
        curl --fail --silent --show-error --location --retry 2 https://downloads.python.org/pypy/pypy3.12-v8.0.1-linux64.tar.gz -o "$archive"
        printf '%s  %s\n' aeed27797777296d9c94e53bdfa608804696dbd4ff9f2213003cce064ee46ef8 "$archive" | sha256sum --check
        tar -xzf "$archive" -C "$RUNNER_TEMP"
        tools/extractors/provision-python.sh tools/extractors "$RUNNER_TEMP/pypy3.12-v8.0.1-linux64/bin/pypy3" html2text markdownify
        uv python install 3.12.15 --no-bin
        tools/extractors/provision-python.sh tools/extractors "$(uv python find 3.12.15 --managed-python)" trafilatura resiliparse
        cargo test --locked --all-targets --all-features -- --skip scores::tests::e2m_handles_images_without_image_paths
        # Vote-web has its own lock file; it shares the same native compiler pin.
        cargo fmt --manifest-path vote-web/Cargo.toml --all -- --check
        node --check vote-web/static/app.js
        cargo clippy --manifest-path vote-web/Cargo.toml --locked --all-targets -- -D warnings
        cargo test --manifest-path vote-web/Cargo.toml --locked --all-targets

  e2m-integration:
    name: E2M heavyweight integration (release tier)
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@d3d509b57a06e72885a83ae743a4014e97cd9f95 # main
    with:
      validation-tier: "release"
      timeout-minutes: 45
      command: |
        # Bootstrap the pinned uv wheel into runner-local ephemeral tooling.
        python3 -m venv "$RUNNER_TEMP/uv-bootstrap"
        "$RUNNER_TEMP/uv-bootstrap/bin/python" -m pip install --disable-pip-version-check --no-input "uv==0.13.9"
        export PATH="$RUNNER_TEMP/uv-bootstrap/bin:$PATH"
        # This public CI uses an ephemeral Ubuntu runner. Install the distro
        # package normally, without disabling namespace restrictions.
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends bubblewrap apparmor-profiles apparmor-utils
        # Enable Ubuntu's packaged, program-specific user-namespace profile;
        # retain the global AppArmor restrictions for other applications.
        if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]; then
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
        fi
        bwrap --version
        bwrap --unshare-all --unshare-user --unshare-net --disable-userns --ro-bind /usr /usr --ro-bind-try /lib /lib --ro-bind-try /lib64 /lib64 -- /usr/bin/true
        uv python install 3.12.15 --no-bin
        tools/extractors/provision-python.sh tools/extractors "$(uv python find 3.12.15 --managed-python)" e2m
        # Worker tests spawn the real binary, not a Rust test harness.
        cargo build --locked --all-features
        cargo test --locked --all-features e2m_handles_images_without_image_paths -- --nocapture
