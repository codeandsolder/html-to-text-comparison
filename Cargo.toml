[package]
name = "html-to-text-comparison"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4", "v7"] }
rand = "0.10.3"
regex = "1.13.1"
scraper = "0.29.0"
similar = "3.2.1"
august = { version = "2.4.0", optional = true }
boilerpipe = { version = "0.6.0", optional = true }
comfy-table = "8.0.1"
dom_smoothie = { version = "0.19.0", optional = true }
fast_html2md = { package = "fast_html2md", version = "=0.0.65", optional = true, default-features = false, features = [
    "scraper",
] }
htmd = { version = "0.5.6", optional = true }
html2md = { version = "0.2.17", optional = true }
html2md-rs = { version = "0.12.2", optional = true }
html2text = { version = "0.17.4", optional = true }
llm_readability = { version = "0.0.17", optional = true }
mdream = { version = "2.1.0", optional = true }
mdka = { version = "3.3.0", optional = true }
nanohtml2text = { version = "0.3.0", optional = true }
readability = { version = "0.3.0", optional = true }
readable-readability = { version = "0.4.0", optional = true }
ureq = { version = "=3.5.2", features = ["json", "charset"] }
url = "2.5.8"
command-group = "5.0.1"
tempfile = "3.27.0"

[features]
default = [
    "august",
    "boilerpipe",
    "dom_smoothie",
    "fast_html2md",
    "htmd",
    "html2md",
    "html2md-rs",
    "html2text",
    "llm_readability",
    "mdream",
    "mdka",
    "nanohtml2text",
    "readability",
    "readable-readability",
]
mdream = ["dep:mdream"]
htmd = ["dep:htmd"]
html2md = ["dep:html2md"]
html2md-rs = ["dep:html2md-rs"]
html2text = ["dep:html2text"]
llm_readability = ["dep:llm_readability"]
mdka = ["dep:mdka"]
nanohtml2text = ["dep:nanohtml2text"]
readability = ["dep:readability"]
readable-readability = ["dep:readable-readability"]
boilerpipe = ["dep:boilerpipe"]
august = ["dep:august"]
fast_html2md = ["dep:fast_html2md"]
reader-lm-api = []
