[package]
name = "html-extraction-voter"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1.54", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rand = "0.10"
uuid = { version = "1.29", features = ["v4"] }
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.7", features = ["trace"] }
