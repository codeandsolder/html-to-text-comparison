name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust 1.99.1 (shared sccache)
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@47aa3c1b587f9933f56310f82427ff86539b3ac9 # main
    with:
      rust-toolchain: "1.99.1"
      timeout-minutes: 45
      command: |
        # Bootstrap the pinned uv wheel into runner-local ephemeral tooling.
        python3 -m venv "$RUNNER_TEMP/uv-bootstrap"
        "$RUNNER_TEMP/uv-bootstrap/bin/python" -m pip install --disable-pip-version-check --no-input "uv==0.13.8"
        export PATH="$RUNNER_TEMP/uv-bootstrap/bin:$PATH"
        PUPPETEER_SKIP_DOWNLOAD=1 npm ci --prefix tools/extractors --ignore-scripts --no-audit --no-fund
        npm test --prefix tools/extractors
        uv run --no-project --with-requirements tools/extractors/python/trafilatura/requirements.txt -- python3 -c 'import trafilatura'
        uv run --no-project --with-requirements tools/extractors/python/resiliparse/requirements.txt -- python3 -c 'from resiliparse.extract.html2text import extract_plain_text'
        cargo test --locked --all-targets --all-features -- --skip scores::tests::e2m_handles_images_without_image_paths
        # Vote-web is a separate Rust 1.99 crate with its own lock file.
        rustup component add --toolchain 1.99.1 rustfmt clippy
        cargo fmt --manifest-path vote-web/Cargo.toml --all -- --check
        node --check vote-web/static/app.js
        cargo clippy --manifest-path vote-web/Cargo.toml --locked --all-targets -- -D warnings
        cargo test --manifest-path vote-web/Cargo.toml --locked --all-targets

  e2m-integration:
    name: E2M heavyweight integration (release tier)
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@47aa3c1b587f9933f56310f82427ff86539b3ac9 # main
    with:
      validation-tier: "release"
      rust-toolchain: "1.99.1"
      timeout-minutes: 45
      command: |
        # Bootstrap the pinned uv wheel into runner-local ephemeral tooling.
        python3 -m venv "$RUNNER_TEMP/uv-bootstrap"
        "$RUNNER_TEMP/uv-bootstrap/bin/python" -m pip install --disable-pip-version-check --no-input "uv==0.13.8"
        export PATH="$RUNNER_TEMP/uv-bootstrap/bin:$PATH"
        uv run --no-project --python 3.12 --with-requirements tools/extractors/python/e2m/requirements.txt -- python3 -c 'from wisup_e2m import HtmlParser'
        # Worker tests spawn the real binary, not a Rust test harness.
        cargo build --locked --all-features
        cargo test --locked --all-features e2m_handles_images_without_image_paths -- --nocapture
